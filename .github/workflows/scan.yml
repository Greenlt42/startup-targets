name: Scan

on:
  schedule:
    # Every 2 hours. EU-Startups alone publishes ~8 articles/day into a feed
    # that only exposes the 10 most recent items — on a busy day the visible
    # window can be under 24h, so a daily cron was silently missing articles
    # that scrolled out between runs (confirmed: this is how we missed the
    # Axle Energy round on 2026-07-12). A no-op run costs a few seconds of
    # Actions minutes, so scanning this often is effectively free.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  trigger-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/scan
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST "${SCAN_URL}/api/scan" \
            -H "Authorization: Bearer ${SCAN_WEBHOOK_SECRET}")
          cat /tmp/response.txt
          if [ "$status" -ge 300 ]; then
            echo "Scan endpoint returned HTTP $status"
            exit 1
          fi
        env:
          SCAN_URL: ${{ vars.SCAN_URL }}
          SCAN_WEBHOOK_SECRET: ${{ secrets.SCAN_WEBHOOK_SECRET }}
